name: CI

# Build libxtc and run the full test suite (make check: munit + PBT +
# shell tests) on every push and pull request.  This is the workflow
# that backs the README's "CI-tested every commit" statement; until
# it existed that claim was aspirational.
#
# The autotools path is the canonical build; meson is a secondary
# stub and is not exercised here.  hegel-c property tests need a local
# hegel server and are configured out in CI (the PBT sources still
# compile; the generative runs are a developer-local step).
#
# I/O backend: these jobs force --with-io-backend=epoll because the
# Codeberg hosted runners execute in containers whose seccomp profile
# blocks the io_uring_* syscalls, so the auto-selected uring backend
# would fail io_uring_queue_init at runtime (the backend is chosen at
# configure time, with no runtime fallback by design).  The GitHub
# mirror runs on VMs that permit io_uring and exercises the uring
# backend, so between the two CIs both Linux backends are covered.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly large-scale DST swarm/soak (100k+ seeds).  02:30 UTC daily.
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    # make check, split: codeberg-small cancels a job at 5:00, and run
    # 8014685 spent 3:49 of build-and-test just building (make check
    # compiles its ~150 test binaries serially) before the first test.
    # Each job builds the library and only its slice of the tests, in
    # parallel, and runs them (scripts/ci-check-part.sh).  The slices
    # c1 c2 c3 exec xproc reclaim sh1 sh2 together are exactly make
    # check, cut from the Makefile's own lists, so a new test needs no
    # edit here.  Measured per slice on 2 host CPUs (gcc, clang, fctx,
    # asan, ubsan alike): setup ~6 s, then 10-44 s per slice; Codeberg
    # runs ~3.3x slower, so the longest is ~2:30 plus ~1 min of install.
    # fctx is the fcontext substrate on glibc (was the coro-fctx job).
    name: build-and-test (${{ matrix.cfg }}, ${{ matrix.part }})
    runs-on: codeberg-small
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        cfg: [gcc, clang, fctx]
        part: [c1, c2, c3, exec, xproc, reclaim, sh1, sh2]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc clang make autoconf automake \
            pkg-config libssl-dev liburing-dev gawk openssl

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i

      - name: Configure (${{ matrix.cfg }})
        run: |
          mkdir -p build_ci
          cd build_ci
          case "${{ matrix.cfg }}" in
            gcc|clang) CC=${{ matrix.cfg }} ../dist/configure --with-tls=auto --with-io-backend=epoll ;;
            fctx) CPPFLAGS=-DXTC_CORO_FORCE_FCTX ../dist/configure --with-tls=auto --with-io-backend=epoll ;;
          esac

      - name: Build the library
        run: make -C build_ci -j"$(nproc)" libxtc.a

      - name: Test (make check slice ${{ matrix.part }})
        run: sh scripts/ci-check-part.sh build_ci ${{ matrix.part }}

  install-headers:
    # Install + compile a consumer against the installed headers (was
    # the last step of build-and-test).
    runs-on: codeberg-small
    timeout-minutes: 5
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake \
            pkg-config libssl-dev liburing-dev gawk openssl
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Install + compile a consumer against the installed headers
        run: XTC_SRC_DIR="$PWD" sh test/dist/test_install_headers.sh

  musl:
    # Build and test against musl libc -- the real execinfo-less,
    # ucontext-less target (builtin _Unwind_Backtrace tier, fctx
    # coroutine substrate, _DEFAULT_SOURCE feature-macro path).  Runs
    # the C unit + property tests; the dist/amalgamation shell tests are
    # skipped (the single-file amalgamation requires ucontext and
    # #errors on musl by design -- the library build is the musl path).
    # Split like build-and-test (5:00 job cap); the slices c1 c2 c3 exec
    # xproc reclaim pbt are exactly tests-c + tests-pbt.
    name: musl (${{ matrix.part }})
    runs-on: codeberg-small
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        part: [c1, c2, c3, exec, xproc, reclaim, pbt]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev make autoconf automake pkg-config gawk
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Configure (musl)
        run: |
          mkdir -p build_musl
          cd build_musl
          CC=musl-gcc ../dist/configure --with-tls=none --without-liburing
      - name: Build the library
        run: make -C build_musl -j"$(nproc)" libxtc.a
      - name: Test (tests-c + tests-pbt slice ${{ matrix.part }})
        run: sh scripts/ci-check-part.sh build_musl ${{ matrix.part }}

  fuzz:
    # libFuzzer harnesses (test/fuzz/): every committed corpus input once
    # -- each crash-* input is a fixed bug -- then 20 s of fuzzing per
    # harness (GitHub's fuzz job runs 60 s each, and fuzz-nightly 10 min).
    # Split in two for the 5:00 cap: the library-linked harnesses build an
    # ASan libxtc first, the example parsers do not.
    name: fuzz (${{ matrix.set }})
    runs-on: codeberg-small
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        set: [lib, examples]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make autoconf automake pkg-config \
            libssl-dev gawk
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Corpus regression, then 20 s per harness
        run: |
          case "${{ matrix.set }}" in
            lib) set -- net cfg tls ;;
            examples) set -- sql quack resp kaka ;;
          esac
          rc=0
          for n in "$@"; do
            CC=clang FUZZ_CONFIGURE="--with-tls=auto --with-io-backend=epoll" \
              sh scripts/fuzz.sh "$n" 0 || rc=1
            CC=clang FUZZ_CONFIGURE="--with-tls=auto --with-io-backend=epoll" \
              sh scripts/fuzz.sh "$n" 20 || rc=1
          done
          exit $rc

  style:
    # clang-format on the lines a change touches (scripts/style-check.sh);
    # informational, like GitHub's style job.  Needs the history for the
    # merge base.
    runs-on: codeberg-small
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format git
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format the changed lines
        run: |
          base=$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~1)
          sh scripts/style-check.sh "$base"

  sim-dst:
    # Deterministic Simulation Testing: sim I/O backend + the multi-loop
    # deterministic scheduler + cross-loop park/wake replay tests.
    # See test/sim/ for the deterministic scheduler + replay tests.
    #
    # codeberg-small cancels a job at 5:00, so the three DST gates are
    # separate jobs.  Measured on run 8014685: install ~20 s, the sim
    # tests ~2:55 (this job, ~3:15 in all).  scripts/dst-bug-inject.sh
    # is GitHub-only: it rebuilds the sim library per planted bug,
    # ~50 s + 17 x ~37 s = ~11 min here, and has no way to run a subset.
    runs-on: codeberg-small
    timeout-minutes: 5
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake pkg-config libssl-dev gawk openssl
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: DST sim-backend tests
        run: XTC_SRC_DIR="$PWD" CC=gcc sh test/sim/run_sim_tests.sh

  sim-dst-corpus:
    # The pinned failing seeds (test/sim/corpus): 13 s on 2 host CPUs,
    # about 1 min here.
    runs-on: codeberg-small
    timeout-minutes: 5
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake pkg-config libssl-dev gawk openssl
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: DST regression corpus (pinned failing seeds cannot silently regress)
        run: CC=gcc sh scripts/dst-corpus.sh

  sim-swarm-nightly:
    # Large-scale DST swarm/soak: 4 disjoint shards x 25k = 100k seeds
    # over the combined fault set (partition + latency + buggify +
    # machine-death).  Nightly (schedule) or on demand; NOT per push --
    # the bounded 300-seed swarm in sim-dst already gates each commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: codeberg-small
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake pkg-config libssl-dev gawk openssl
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Build the sim-backend library
        run: |
          mkdir -p build_sim
          cd build_sim
          ../dist/configure --with-io-backend=sim --with-tls=none --without-liburing
          make -j"$(nproc)"
      - name: Compile the swarm harness
        run: |
          gcc -std=c11 -D_GNU_SOURCE -I src/inc \
            test/sim/test_sim_swarm.c build_sim/libxtc.a \
            -pthread -ldl -lm -o build_sim/test_sim_swarm
      - name: Run 100k-seed swarm (4 disjoint shards)
        run: |
          N=25000
          set -e
          rc=0
          for base in 0 $N $((N*2)) $((N*3)); do
            ( ./build_sim/test_sim_swarm "$N" "$base" \
                > "swarm-$base.log" 2>&1 ; echo "$? $base" > "swarm-$base.rc" ) &
          done
          wait
          for base in 0 $N $((N*2)) $((N*3)); do
            echo "--- shard base=$base ---"; tail -3 "swarm-$base.log"
            read -r code _ < "swarm-$base.rc"
            [ "$code" = 0 ] || { echo "shard base=$base FAILED (rc=$code)"; rc=1; }
          done
          exit $rc

  sched-policy:
    # Optional scheduler policies: off/on native+sim builds, installed
    # consumers, exact default dispatch-trace equivalence, batch replay.
    runs-on: codeberg-small
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake pkg-config gawk
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Scheduler feature matrix and replay equivalence
        timeout-minutes: 25
        run: sh test/dist/test_sched_policy_build.sh
      - name: Cross-loop batch admission, looped
        # The mt cases race producers against the driver; a small runner
        # rarely loses a race once, so run them 20 times (about 1 s each).
        timeout-minutes: 10
        run: |
          mkdir build_mt && cd build_mt
          ../dist/configure --enable-sched-policy --with-io-backend=epoll \
            --with-tls=none >/dev/null
          make -j2 test_batch >/dev/null
          for i in $(seq 20); do
            timeout 60 ./test_batch --mt-only >/dev/null ||
              { echo "test_batch --mt-only failed on iteration $i"; exit 1; }
          done

  sanitizers:
    # make check under ASan / UBSan, split like build-and-test (5:00 job
    # cap).  Sanitized tests run ~1.1x the plain ones on 2 host CPUs.
    name: sanitizers (${{ matrix.sanitizer }}, ${{ matrix.part }})
    runs-on: codeberg-small
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
        part: [c1, c2, c3, exec, xproc, reclaim, sh1, sh2]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make autoconf automake pkg-config libssl-dev liburing-dev gawk openssl

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i

      - name: Configure with ${{ matrix.sanitizer }} sanitizer
        run: |
          mkdir -p build_san
          cd build_san
          CFLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g -O1" \
          LDFLAGS="-fsanitize=${{ matrix.sanitizer }}" \
            ../dist/configure --with-tls=auto --with-io-backend=epoll

      - name: Build the library
        run: make -C build_san -j"$(nproc)" libxtc.a

      - name: Test under sanitizer (make check slice ${{ matrix.part }})
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: sh scripts/ci-check-part.sh build_san ${{ matrix.part }}

  examples:
    # Build the examples and run kaka's in-process tests, the sqlxtc
    # multi-thread load and the two network + storage soaks.  The sqlxtc
    # in-process tests are the examples-sqlxtc matrix below: codeberg-small
    # cancels a job at 5:00 and run 8014685 measured them at ~37-43 s
    # each (every engine test recompiles the engine), ~12 min in all.
    # This job, measured on 2 host CPUs (Codeberg is ~3.5x slower on
    # compile-bound steps): install ~20 s, lib 5.5 s, kaka 4.3 s, soaks
    # 2 x SECS + ~25 s of builds -> ~2:30 here.
    runs-on: codeberg-small
    timeout-minutes: 5
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make autoconf automake pkg-config libssl-dev liburing-dev gawk openssl python3
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Build libxtc
        run: |
          mkdir -p build_ci
          cd build_ci
          ../dist/configure --with-tls=auto --with-io-backend=epoll
          make -j"$(nproc)"
      - name: kaka in-process tests
        working-directory: examples/07_kaka
        run: |
          make XTC_BUILD=../../build_ci
          ./test_frame
          ./test_partition
          ./test_broker
          ./test_group
      - name: sqlxtc multi-thread load (one loop per CPU; cross-loop regression)
        working-directory: examples/06_sqlxtc
        run: |
          make XTC_BUILD=../../build_ci sqlxtc-server
          bash ../../test/sqlxtc/test_sqlxtc_mt.sh
      - name: kaka network + storage soak, and its planted-bug control
        # See the GitHub examples job.  SECS=5 keeps the data written
        # under ~1 GB on a small runner; the soak's segment checks still
        # bite at 500 IOPS (measured: 420 segments in 20 s).
        timeout-minutes: 2
        working-directory: examples/07_kaka
        run: |
          make XTC_BUILD=../../build_ci kaka-broker kaka_soak kaka-broker-plant
          SECS=5 make XTC_BUILD=../../build_ci soak
          SECS=3 make XTC_BUILD=../../build_ci soak-plant
      - name: sqlxtc network + storage soak, and its planted-bug control
        timeout-minutes: 3
        working-directory: examples/06_sqlxtc
        run: |
          make -j"$(nproc)" XTC_BUILD=../../build_ci sqlxtc-server sqlxtc-server-plant
          SECS=5 make XTC_BUILD=../../build_ci soak
          SECS=3 make XTC_BUILD=../../build_ci soak-plant

  examples-sqlxtc:
    # The sqlxtc in-process tests (the GitHub examples job's 1.58 list),
    # in 6 shards.  Each test was timed alone on 2 host CPUs and in this
    # runner's image (docker --cpus=2); run 8014685 ran its first 15
    # tests 3.3x slower than either.  A shard's estimate is the larger of
    # 3.4 x host and 1.4 x image (the image's disk is slow, so the two
    # disagree on the fsync-bound tests): at most ~110 s of tests per
    # shard, plus ~50 s of setup.  The tests added in 1.59 run on GitHub only, and
    # so does test-wal-bigtxn: its racing writers commit for as long as
    # the big transaction runs, so its time is fsync latency x ~500k
    # commits (2 CPUs: 5 s on tmpfs, 34 s on local NVMe, 791 s in this
    # image).  A new test goes in the shard with the fewest seconds.
    name: examples-sqlxtc (shard ${{ matrix.shard }})
    runs-on: codeberg-small
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            tests: test-xlog test-recover-undo test-bufmgr test-redo-page test-cursor-resume test-steal-torn test-btnode amalg
          - shard: 2
            tests: test-isolation test-steal-reclaim
          - shard: 3
            tests: test-quack test-sql-parse test-wal-recover test-xstore-scan test-scan-resist test-clean-restart test-wal-group-sync test-rowid-minmax test-dio-restart
          - shard: 4
            tests: test-wal test-wal-compact test-xstore test-steal-page test-btree test-btree-delete-merge test-ckpt-online test-intents-thread test-btree-fill test-wal-prealloc
          - shard: 5
            tests: test-torn-smo test-native-txn test-snap-registry
          - shard: 6
            tests: test-admin test-shard test-mvcc test-inplace-redo test-bufmgr-mt test-persist test-steal test-steal-leaf test-btree-loop test-btree-mt test-savepoint test-cat-reopen test-torn-base test-tr-slice
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make autoconf automake pkg-config libssl-dev liburing-dev gawk openssl python3
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Build libxtc
        run: |
          mkdir -p build_ci
          cd build_ci
          ../dist/configure --with-tls=auto --with-io-backend=epoll
          make -j"$(nproc)"
      - name: sqlxtc in-process tests, shard ${{ matrix.shard }}
        working-directory: examples/06_sqlxtc
        run: make XTC_BUILD=../../build_ci ${{ matrix.tests }}

  tls-backends:
    # Build against each TLS backend that works with the apt packages
    # on the small Codeberg runner and run the m18 TLS suite.  BoringSSL
    # (from-source: cmake + Go) and mbedTLS (the backend needs the 3.x
    # API, but apt ships 2.x) are impractical here, so they run on the
    # GitHub mirror's tls-backends job; openssl, gnutls, and wolfssl are
    # exercised on both CIs.
    runs-on: codeberg-small
    strategy:
      fail-fast: false
      matrix:
        backend: [openssl, gnutls, wolfssl]
    steps:
      - name: Install base toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake pkg-config \
            liburing-dev gawk openssl
      - name: Install backend ${{ matrix.backend }}
        run: |
          case "${{ matrix.backend }}" in
            openssl)   sudo apt-get install -y libssl-dev ;;
            gnutls)    sudo apt-get install -y libgnutls28-dev ;;
            wolfssl)   sudo apt-get install -y libwolfssl-dev ;;
          esac
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Configure --with-tls=${{ matrix.backend }}
        run: |
          mkdir -p build_tls && cd build_tls
          ../dist/configure --with-tls=${{ matrix.backend }} --with-io-backend=epoll
      - name: Build + run the m18 TLS suite (incl. per-backend ALPN validation)
        run: |
          make -C build_tls -j"$(nproc)" test_tls_basic test_tls_server test_tls_client
          ( cd build_tls && ./test_tls_basic && ./test_tls_server && ./test_tls_client )
