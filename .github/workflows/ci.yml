name: CI

# Mirror of the Codeberg CI for the GitHub mirror.  Builds libxtc and
# runs the full test suite across gcc + clang plus ASan/UBSan.  See
# .forgejo/workflows/ci.yml for the canonical version and the notes
# on why autotools (not meson) is the path under test.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly large-scale DST swarm/soak (100k+ seeds).  02:30 UTC daily.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      swarm_shard_seeds:
        description: 'seeds per shard for a manual swarm run'
        default: '25000'
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.compiler }} make autoconf automake \
            pkg-config libssl-dev liburing-dev gawk

      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i

      - name: Configure
        run: |
          mkdir -p build_ci
          cd build_ci
          # -Werror: warnings are build failures (the library and all
          # tests compile clean under gcc and clang; keep it that way).
          CC=${{ matrix.compiler }} CFLAGS="-Werror" \
            ../dist/configure --with-tls=auto

      - name: API discipline gate (fast fail before the build)
        run: XTC_SRC_DIR="$PWD" sh test/dist/test_api_discipline.sh

      - name: Build
        run: make -C build_ci -j"$(nproc)"

      - name: Test
        run: make -C build_ci check

      - name: Install + compile a consumer against the installed headers
        run: |
          XTC_SRC_DIR="$PWD" CC=${{ matrix.compiler }} \
            sh test/dist/test_install_headers.sh

  coro-fctx:
    # Force the fcontext coroutine substrate (the musl path) on a
    # glibc runner so it is exercised every commit without a musl
    # toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf pkg-config libssl-dev liburing-dev gawk
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Configure (force fcontext)
        run: |
          mkdir -p build_fctx
          cd build_fctx
          CPPFLAGS=-DXTC_CORO_FORCE_FCTX ../dist/configure --with-tls=auto
      - name: Build
        run: make -C build_fctx -j"$(nproc)"
      - name: Test
        run: make -C build_fctx check

  musl:
    # Build and test against musl libc -- the real execinfo-less,
    # ucontext-less target.  Exercises the builtin _Unwind_Backtrace
    # backtrace tier (no libunwind), the fctx coroutine substrate
    # (configure leaves XTC_HAVE_UCONTEXT undefined on musl), and the
    # _DEFAULT_SOURCE feature-macro path.  Runs the C unit tests + the
    # property tests; the shell/dist tests are skipped here because the
    # single-file amalgamation deliberately requires ucontext (it cannot
    # carry the fctx assembly) and #errors on musl by design -- the
    # library build is the supported musl path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev make autoconf pkg-config gawk
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Configure (musl)
        run: |
          mkdir -p build_musl
          cd build_musl
          CC=musl-gcc ../dist/configure --with-tls=none --without-liburing
      - name: Build
        run: make -C build_musl -j"$(nproc)"
      - name: Test (unit + property)
        run: make -C build_musl tests-c tests-pbt
      - name: Confirm fctx substrate is active (no execinfo/ucontext)
        run: |
          # musl has neither <execinfo.h> nor ucontext, so the library
          # uses the fctx coroutine substrate and a non-execinfo
          # backtrace tier.  Which backtrace tier (builtin _Unwind vs
          # the no-op stub) depends on whether the toolchain links
          # libgcc_s in the configure probe: a full musl toolchain gets
          # builtin _Unwind_Backtrace; the minimal Ubuntu musl-gcc
          # wrapper may not link the unwinder in the probe and falls to
          # the stub (an acceptable degradation -- the dump still works
          # without a C stack).  So assert only the invariants that hold
          # on every musl: execinfo + ucontext absent (fctx active).
          ! grep -q 'define XTC_HAVE_EXECINFO 1' build_musl/xtc_config.h
          ! grep -q 'define XTC_HAVE_UCONTEXT 1' build_musl/xtc_config.h
          echo "musl: execinfo + ucontext absent (fctx substrate active); backtrace tier:"
          grep -E 'define XTC_HAVE_(BUILTIN_UNWIND|LIBUNWIND) 1' build_musl/xtc_config.h \
            || echo "  (stub backtrace -- toolchain did not link an unwinder in the probe)"

  sim-dst:
    # Deterministic Simulation Testing: build with the sim I/O backend
    # and run the multi-loop deterministic scheduler + cross-loop
    # park/wake replay tests (the REAL work-stealing executor, made
    # deterministic with a seed).  See test/sim/ for the deterministic scheduler + replay tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf pkg-config libssl-dev gawk
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: DST sim-backend tests
        run: XTC_SRC_DIR="$PWD" CC=gcc sh test/sim/run_sim_tests.sh

      - name: DST bug-injection (prove DST catches planted safety bugs)
        run: CC=gcc TMPDIR="${RUNNER_TEMP:-/tmp}" sh scripts/dst-bug-inject.sh

      - name: DST regression corpus (pinned failing seeds cannot silently regress)
        run: CC=gcc TMPDIR="${RUNNER_TEMP:-/tmp}" sh scripts/dst-corpus.sh

  sim-swarm-nightly:
    # Large-scale DST swarm/soak: 4 disjoint shards x 25k = 100k seeds
    # over the combined fault set (partition + latency + buggify +
    # machine-death).  Nightly (schedule) or on demand (workflow_dispatch);
    # NOT on every push -- the bounded 300-seed swarm in the sim-dst job
    # already gates each commit.  See test/sim/README.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf pkg-config libssl-dev gawk
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Build the sim-backend library
        run: |
          mkdir -p build_sim
          cd build_sim
          ../dist/configure --with-io-backend=sim --with-tls=none \
            --without-liburing
          make -j"$(nproc)"
      - name: Compile the swarm harness
        run: |
          gcc -std=c11 -D_GNU_SOURCE -I src/inc \
            test/sim/test_sim_swarm.c build_sim/libxtc.a \
            -pthread -ldl -lm -o build_sim/test_sim_swarm
      - name: Run 100k-seed swarm (4 disjoint shards)
        run: |
          N='${{ github.event.inputs.swarm_shard_seeds || 25000 }}'
          set -e
          rc=0
          for base in 0 $N $((N*2)) $((N*3)); do
            ( ./build_sim/test_sim_swarm "$N" "$base" \
                > "swarm-$base.log" 2>&1 ; echo "$? $base" > "swarm-$base.rc" ) &
          done
          wait
          for base in 0 $N $((N*2)) $((N*3)); do
            echo "--- shard base=$base ---"; tail -3 "swarm-$base.log"
            read -r code b < "swarm-$base.rc"
            [ "$code" = 0 ] || { echo "shard base=$base FAILED (rc=$code)"; rc=1; }
          done
          exit $rc

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make autoconf pkg-config libssl-dev liburing-dev gawk

      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i

      - name: Configure with ${{ matrix.sanitizer }} sanitizer
        run: |
          mkdir -p build_san
          cd build_san
          CFLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g -O1" \
          LDFLAGS="-fsanitize=${{ matrix.sanitizer }}" \
            ../dist/configure --with-tls=auto

      - name: Build
        run: make -C build_san -j"$(nproc)"

      - name: Test under sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make -C build_san check

  tsan-fibers:
    # ThreadSanitizer over the cooperative-fiber runtime.  TSan needs
    # each coroutine as a TSan fiber object (__tsan_create/switch/destroy
    # _fiber), a clang-only compiler-rt feature the coro substrates emit
    # under XTC_TSAN_FIBERS.  This job proves the fiber suite runs TSan-
    # clean with clang; gcc TSan has no fiber support (documented), so
    # this job is clang-only by design.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang make autoconf pkg-config libssl-dev liburing-dev gawk
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Configure with clang ThreadSanitizer
        run: |
          mkdir -p build_tsan
          cd build_tsan
          CC=clang \
          CFLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1" \
          LDFLAGS="-fsanitize=thread" \
            ../dist/configure --with-io-backend=epoll --with-tls=auto
      - name: Build
        run: make -C build_tsan -j"$(nproc)"
      - name: Fiber suite under TSan (zero warnings required)
        env:
          # detect_deadlocks=0: TSan's deadlock detector has a fixed
          # 64-lock history cap that the RCU-resize path (many slab
          # locks while retiring nodes) overflows -- a tool limit, not a
          # libxtc deadlock.  suppressions catalogues the documented
          # benign executor/steal hint races (see .github/tsan.supp).
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:detect_deadlocks=0:suppressions=${{ github.workspace }}/.github/tsan.supp
        run: |
          cd build_tsan
          rc=0
          for t in test_fctx test_async test_proc test_svr test_chan test_proc_table_stress; do
            make "$t" >/dev/null 2>&1 || continue
            echo "=== $t ==="
            ./"$t" 2>&1 | tee "tsan_$t.log"
            if grep -q "WARNING: ThreadSanitizer" "tsan_$t.log"; then
              echo "TSan warning in $t"; rc=1
            fi
          done
          exit $rc

  valgrind:
    # Run the runtime under Valgrind's memcheck + Helgrind + DRD over a
    # curated, fast subset of the C unit tests.  The full munit suite is
    # far too slow under Valgrind, so each tool sees only a handful of
    # binaries chosen to exercise allocation and real threads without
    # needing many cores or real sockets.
    #
    # Substrate choices that matter for Valgrind:
    #   * epoll I/O backend (NOT io_uring -- Valgrind does not model
    #     io_uring and the runner may lack it).
    #   * ucontext coroutine substrate (configure's default on glibc):
    #     Valgrind's stack-change tracking copes with ucontext far
    #     better than with the raw fcontext assembly.
    #
    # Gating policy:
    #   * memcheck GATES the job (--error-exitcode=1): a leak or invalid
    #     access is a real bug and must go red.  Its subset deliberately
    #     excludes tests that fault on purpose (e.g. test_proc's
    #     flt_faulter writes to a null-ish address to drive crash
    #     recovery -- a genuine invalid write memcheck rightly flags).
    #   * Helgrind and DRD are INFORMATIONAL (report printed, job not
    #     failed).  They mis-model the work-stealing executor's and lock
    #     manager's atomic lifecycle handshakes and report benign
    #     teardown races; a small suppressions file (.github/valgrind.supp)
    #     silences the understood ones, and the rest are surfaced for a
    #     human to read rather than used to gate.  Flip the `|| true`
    #     below to make them gate once the runtime is annotated for the
    #     race detectors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valgrind gcc make autoconf automake pkg-config libssl-dev gawk

      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i

      - name: Configure (epoll backend, ucontext substrate)
        run: |
          mkdir -p build_vg
          cd build_vg
          ../dist/configure --with-tls=auto --with-io-backend=epoll

      - name: Build the memcheck + race-detector test subsets
        run: |
          make -C build_vg -j"$(nproc)" \
            test_chan test_mctx test_timer test_loop test_svr \
            test_sync test_lockmgr test_exec test_cross_wake

      - name: memcheck (leak + error gate)
        working-directory: build_vg
        run: |
          set -e
          # Curated subset: allocation- and concurrency-heavy tests that
          # do not deliberately fault.  Gated: any error fails the job.
          for t in test_chan test_mctx test_timer test_loop test_svr \
                   test_sync test_lockmgr; do
            echo "===== memcheck $t ====="
            valgrind --tool=memcheck \
              --suppressions=../.github/valgrind.supp \
              --leak-check=full \
              --show-leak-kinds=definite,indirect \
              --errors-for-leak-kinds=definite \
              --track-origins=yes \
              --error-exitcode=1 \
              ./$t
          done

      - name: Helgrind (data-race detector, informational)
        working-directory: build_vg
        run: |
          # Smaller, genuinely multi-threaded subset.  Informational:
          # the report is printed but does not gate (see job comment).
          for t in test_exec test_cross_wake test_sync test_lockmgr; do
            echo "===== helgrind $t ====="
            valgrind --tool=helgrind \
              --suppressions=../.github/valgrind.supp \
              ./$t || echo "helgrind $t reported issues (informational)"
          done

      - name: DRD (data-race detector, informational)
        working-directory: build_vg
        run: |
          for t in test_exec test_cross_wake test_sync test_lockmgr; do
            echo "===== drd $t ====="
            valgrind --tool=drd \
              --suppressions=../.github/valgrind.supp \
              ./$t || echo "drd $t reported issues (informational)"
          done

  examples:
    # Build the examples and run their in-process tests (no daemons,
    # so nothing hangs CI).  The examples exercise the public API
    # broadly -- including the single-file amalgamation drop-in -- and
    # would otherwise rot unnoticed since the library make check does
    # not build them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Lime submodule (best-effort)
        # The Lime submodule lives on Codeberg and is used only by the
        # sqlxtc parser-staleness check, which already no-ops when it is
        # absent.  Fetch it in its own non-fatal step so a Codeberg
        # outage (504 at checkout) does not fail the whole examples job
        # -- the parser check simply skips, everything else still runs.
        continue-on-error: true
        run: git submodule update --init --recursive || true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make autoconf pkg-config libssl-dev liburing-dev gawk python3
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Build libxtc
        run: |
          mkdir -p build_ci
          cd build_ci
          ../dist/configure --with-tls=auto
          make -j"$(nproc)"
      - name: kaka in-process tests
        working-directory: examples/07_kaka
        run: |
          make XTC_BUILD=../../build_ci
          ./test_frame
          ./test_partition
          ./test_broker
          ./test_group
      - name: sqlxtc in-process tests + amalgamation
        working-directory: examples/06_sqlxtc
        run: |
          make XTC_BUILD=../../build_ci test-quack test-sql-parse test-admin test-wal test-wal-recover test-torn-smo test-wal-compact test-shard test-mvcc test-xstore test-xstore-scan test-xlog test-recover-undo test-bufmgr test-redo-page test-inplace-redo test-bufmgr-mt test-scan-resist test-persist test-cursor-resume test-clean-restart test-steal test-steal-torn test-steal-page test-steal-leaf test-btnode test-btree test-btree-loop test-btree-mt test-btree-delete-merge test-savepoint test-isolation test-native-txn
          make XTC_BUILD=../../build_ci amalg
      - name: sqlxtc Lime parser is regenerable + committed copy is current
        working-directory: examples/06_sqlxtc
        run: |
          # Build Lime from the submodule, regenerate the parser, and
          # diff against the committed sql_parse_gen.[ch].  Fails if the
          # committed generated parser is stale relative to the grammar
          # (someone changed sql_grammar.lime without regenerating) or if
          # the grammar's %expect conflict count no longer matches.
          if [ ! -d lime/src ]; then
            echo "lime submodule not checked out; skipping staleness check"
            exit 0
          fi
          make -C lime JIT=0 bin/lime
          cp sql_parse_gen.c /tmp/committed_gen.c
          cp sql_parse_gen.h /tmp/committed_gen.h
          make sql_parse   # regenerates sql_parse_gen.[ch] (lime exits non-zero on a %expect mismatch)
          diff -u /tmp/committed_gen.c sql_parse_gen.c
          diff -u /tmp/committed_gen.h sql_parse_gen.h
      - name: sqlxtc multi-thread load (one loop per CPU; cross-loop regression)
        working-directory: examples/06_sqlxtc
        run: |
          make XTC_BUILD=../../build_ci sqlxtc-server
          bash ../../test/sqlxtc/test_sqlxtc_mt.sh
      - name: sqlxtc differential oracle (vs python sqlite3 -- the correctness proof)
        working-directory: examples/06_sqlxtc
        run: |
          # The whole corpus must match a reference SQLite (python's
          # sqlite3 module, linked separately from the engine).  This is
          # the differential that proves the native engine is
          # functionally equivalent to SQLite, and it must keep passing
          # as sqlite3.c is excised.
          bash ../../test/sqlxtc/test_sqlxtc_oracle.sh

  tls-backends:
    # Build the library against each TLS backend and run the m18 TLS
    # suite, so every backend is exercised on every push -- not just
    # the --with-tls=auto (OpenSSL) default the other jobs use.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [openssl, mbedtls, gnutls, wolfssl, boringssl]
    steps:
      - uses: actions/checkout@v4
      - name: Install base toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake pkg-config \
            liburing-dev gawk
      - name: Install backend ${{ matrix.backend }}
        run: |
          case "${{ matrix.backend }}" in
            openssl)   sudo apt-get install -y libssl-dev ;;
            gnutls)    sudo apt-get install -y libgnutls28-dev ;;
            wolfssl)   sudo apt-get install -y libwolfssl-dev ;;
            mbedtls)
              # The Ubuntu libmbedtls-dev is 2.x; tls_mbedtls.c uses the
              # 3.x API (mbedtls_ssl_protocol_version, 3-arg
              # pk_parse_keyfile), so build mbedTLS 3.x from source.
              # 3.6 pulls its build framework in as a submodule.
              sudo apt-get install -y cmake
              git clone --depth 1 --branch v3.6.2 --recurse-submodules \
                https://github.com/Mbed-TLS/mbedtls /tmp/mbed
              cmake -S /tmp/mbed -B /tmp/mbed/build -DCMAKE_BUILD_TYPE=Release \
                    -DENABLE_TESTING=Off -DENABLE_PROGRAMS=Off \
                    -DCMAKE_POSITION_INDEPENDENT_CODE=ON >/dev/null
              cmake --build /tmp/mbed/build -j"$(nproc)" >/dev/null
              ;;
            boringssl)
              # No distro package; build the static libs.  CMake + a Go
              # toolchain are on the runner image.  Modern BoringSSL
              # emits libssl.a / libcrypto.a directly under the build
              # dir; locate them rather than assume a layout.
              sudo apt-get install -y cmake golang-go
              git clone --depth 1 https://boringssl.googlesource.com/boringssl /tmp/bssl
              cmake -S /tmp/bssl -B /tmp/bssl/build -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_POSITION_INDEPENDENT_CODE=ON >/dev/null
              cmake --build /tmp/bssl/build -j"$(nproc)" --target ssl crypto >/dev/null
              ;;
          esac
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Configure --with-tls=${{ matrix.backend }}
        run: |
          mkdir -p build_tls && cd build_tls
          case "${{ matrix.backend }}" in
            boringssl)
              SSL_A=$(find /tmp/bssl/build -name libssl.a | head -1)
              CRY_A=$(find /tmp/bssl/build -name libcrypto.a | head -1)
              # BoringSSL is C++; -lstdc++ must come AFTER its .a files on
              # the link line, so append it via LDFLAGS (which the test
              # link rule places after libxtc.a) rather than LIBS.
              CPPFLAGS="-I/tmp/bssl/include" \
              LDFLAGS="-L$(dirname "$SSL_A") -L$(dirname "$CRY_A")" \
              LIBS="-lssl -lcrypto -lstdc++" \
                ../dist/configure --with-tls=boringssl ;;
            mbedtls)
              LIB=$(dirname "$(find /tmp/mbed/build -name libmbedtls.a | head -1)")
              CPPFLAGS="-I/tmp/mbed/include" LDFLAGS="-L$LIB" \
                ../dist/configure --with-tls=mbedtls ;;
            *)
              ../dist/configure --with-tls=${{ matrix.backend }} ;;
          esac
      - name: Build + run the m18 TLS suite
        run: |
          make -C build_tls -j"$(nproc)" test_tls_server test_tls_client
          ( cd build_tls && ./test_tls_server && ./test_tls_client )

  macos:
    # macOS runtime coverage: kqueue I/O backend + ucontext coroutine
    # substrate (the x86-64 fcontext .S files self-gate to empty on
    # macOS / Apple Silicon).  Runs the FULL `make check` (an external
    # Apple-Silicon reviewer confirmed it is green on a stock macOS box
    # once the autoreconf skip-guards landed), under -Werror, plus a
    # make-install + consumer-link smoke -- so macOS-only build/
    # packaging regressions (a warning, a shell gate, an install-header
    # gap) are caught in CI instead of by a human on a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install autoconf automake pkg-config gawk openssl@3
      - name: Autoreconf
        working-directory: dist
        run: autoreconf -i
      - name: Configure
        run: |
          mkdir -p build_ci && cd build_ci
          PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig" \
            CFLAGS="-Werror" \
            ../dist/configure --with-tls=auto
      - name: Build
        run: make -C build_ci -j3
      - name: Check (full C + shell suite)
        run: make -C build_ci check
      - name: Install + consumer-link smoke
        # Prove `make install` ships a usable header+lib+pkg-config set
        # on macOS: install into a DESTDIR, then compile+link+run a tiny
        # consumer against ONLY the installed headers, resolving link
        # flags through the installed xtc.pc via pkg-config --static
        # (the way a real consumer links -- this also validates that
        # xtc.pc's Libs.private is correct on macOS).  Install
        # locations are read back from the Makefile, not hard-coded.
        run: |
          dest="$(mktemp -d)"
          make -C build_ci install DESTDIR="$dest"
          lib="$dest$(make -C build_ci -s print-libdir 2>/dev/null || echo /usr/local/lib)"
          # PKG_CONFIG_SYSROOT_DIR prepends the DESTDIR to xtc.pc's
          # ${includedir}/${libdir}; PKG_CONFIG_PATH also carries the
          # Homebrew openssl .pc so the TLS transitive deps resolve.
          export PKG_CONFIG_SYSROOT_DIR="$dest"
          export PKG_CONFIG_PATH="$lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig"
          echo "xtc.pc resolves to:"; pkg-config --cflags --libs --static xtc
          printf '%s\n' '#include <stdio.h>' '#include "xtc.h"' '#include "xtc_loop.h"' 'int main(void){printf("libxtc %s\n", xtc_version_string());return 0;}' > /tmp/xtc_consumer.c
          cc $(pkg-config --cflags xtc) /tmp/xtc_consumer.c $(pkg-config --libs --static xtc) -o /tmp/xtc_consumer
          /tmp/xtc_consumer
      - name: Shared-library build + dynamic-link smoke (Darwin dylib branch)
        # Validates the macOS --enable-shared path (Makefile Darwin
        # branch: -dynamiclib / -install_name / -exported_symbols_list).
        # Build a real .dylib, install it, link a consumer with plain
        # -lxtc, and confirm via otool -L that it binds the DYLIB (not
        # the static archive), then run it.
        run: |
          mkdir -p build_shared && cd build_shared
          PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig" \
            CFLAGS="-Werror" \
            ../dist/configure --enable-shared --with-tls=auto --prefix="$HOME/xtc-inst"
          make -j3
          ls -l libxtc.*.dylib libxtc.dylib
          # Install to the REAL prefix (a throwaway runner dir): the
          # Darwin dylib records an absolute -install_name of
          # $(libdir)/libxtc.MAJOR.dylib, so the consumer must find it
          # there at runtime -- staging to a DESTDIR would leave the
          # install_name pointing at an unwritten path.
          make install
          inc="$HOME/xtc-inst/include"; lib="$HOME/xtc-inst/lib"
          printf '%s\n' '#include <stdio.h>' '#include "xtc.h"' 'int main(void){printf("libxtc %s\n", xtc_version_string());return 0;}' > /tmp/xtc_dyn.c
          cc -I"$inc" /tmp/xtc_dyn.c -L"$lib" -lxtc -o /tmp/xtc_dyn
          otool -L /tmp/xtc_dyn | grep -q 'libxtc\..*dylib' && echo "consumer binds the dylib: OK"
          /tmp/xtc_dyn
      - name: sqlxtc multi-thread load (one loop per CPU; cross-loop regression)
        working-directory: examples/06_sqlxtc
        run: |
          make XTC_BUILD=../../build_ci sqlxtc-server
          bash ../../test/sqlxtc/test_sqlxtc_mt.sh

  freebsd:
    # FreeBSD runtime coverage in a VM on the Linux runner
    # (vmactions/freebsd-vm).  Exercises the kqueue I/O backend + the
    # ucontext substrate under clang -- the same combination re-verified
    # by hand on the FreeBSD host, now on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake autoconf automake pkgconf gawk
          run: |
            cd dist && autoreconf -i && cd ..
            mkdir -p build_bsd && cd build_bsd
            ../dist/configure --with-tls=none
            gmake -j$(sysctl -n hw.ncpu)
            gmake check

  riscv64-qemu:
    # RISC-V 64 cross-arch coverage via QEMU user-mode emulation.
    # Catches width/endian/atomics bugs the x86/arm CI would miss.
    # Builds with the riscv64 cross-gcc and runs the C unit + property
    # suites under binfmt/qemu-user (registered by the docker/setup-qemu
    # action).  The full shell/dist tests stay on native Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register qemu-user binfmt (riscv64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Build + test under riscv64 emulation
        run: |
          docker run --rm --platform linux/riscv64 \
            -v "$PWD":/src -w /src riscv64/ubuntu:24.04 \
            bash -c '
              apt-get update &&
              apt-get install -y gcc make autoconf automake pkg-config gawk &&
              cd dist && autoreconf -i && cd .. &&
              mkdir -p build_rv && cd build_rv &&
              ../dist/configure --with-io-backend=epoll --with-tls=none --without-liburing &&
              make -j"$(nproc)" &&
              make tests-c tests-pbt
            '

  windows-msvc:
    # Windows / MSVC: builds xtc.lib from src (cl + ml64 for the
    # MASM fcontext port) and runs the smoke test.  The full munit
    # harness uses GCC-isms cl rejects, so the smoke test stands in
    # (see dist/build_msvc.bat / test/msvc/smoke.c).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC (cl, ml64, lib on PATH)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build xtc.lib + smoke, run smoke
        shell: cmd
        run: |
          set XTC_SRC=%CD%
          call dist\build_msvc.bat
